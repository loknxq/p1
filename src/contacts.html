<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - Сайтик</title>
    <meta name="description" content="Свяжитесь с нами для сотрудничества">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <a class="site-header__brand" href="index.html">Сайтик</a>
        <nav class="site-nav" aria-label="Основная навигация">
            <ul class="site-nav__list">
                <li class="site-nav__item">
                    <a class="site-nav__link" href="index.html">Главная</a>
                </li>
                <li class="site-nav__item">
                    <a class="site-nav__link" href="about.html">О нас</a>
                </li>
                <li class="site-nav__item">
                    <a class="site-nav__link site-nav__link--active site-nav__link--cta"
                        href="contacts.html">Связаться</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <!-- Хлебные крошки -->
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <a href="index.html">Главная</a> →
            <span>Контакты</span>
        </nav>

        <h1>Контакты</h1>

        <section class="section">
            <h2>Наши контакты</h2>
            <p>Телефон: +7 (123) 456-78-90</p>
            <p>Email: info@saitic.ru</p>
            <p>Адрес: г. Москва, ул. Примерная, д. 123</p>

            <button id="openDialog" type="button" class="button button--primary">Написать нам</button>
        </section>
    </main>

    <!-- Модалка с формой -->
    <dialog id="contactDialog" class="dialog" aria-labelledby="dialogTitle">
        <h2 id="dialogTitle">Обратная связь</h2>
        <form id="contactForm" method="dialog" novalidate class="form">
            <label for="name" class="form__label">Имя</label>
            <input id="name" name="name" type="text" required minlength="2" autocomplete="given-name"
                class="form__input">

            <label for="email" class="form__label">E-mail</label>
            <input id="email" name="email" type="email" required autocomplete="email" class="form__input">

            <label for="phone" class="form__label">Телефон</label>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" aria-describedby="phoneHelp"
                placeholder="+7 (___) ___-__-__" required pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$"
                class="form__input">
            <small id="phoneHelp" class="form__help">Формат: +7 (900) 000-00-00</small>

            <label for="date" class="form__label">Дата</label>
            <input id="date" name="date" type="date" class="form__input">

            <label for="topic" class="form__label">Тема</label>
            <select id="topic" name="topic" required class="form__select">
                <option value="">Выберите тему</option>
                <option>Вопрос</option>
                <option>Заказ</option>
            </select>

            <label for="message" class="form__label">Сообщение</label>
            <textarea id="message" name="message" rows="4" required class="form__textarea"></textarea>

            <div class="form-actions">
                <button type="button" id="closeDialog" class="button">Закрыть</button>
                <button type="submit" class="button button--primary">Отправить</button>
            </div>
        </form>
    </dialog>

    <footer class="site-footer">
        <p>&copy; 2025 Сайтик. Все права защищены.</p>
        <p>Телефон: +7 (123) 456-78-90</p>
    </footer>

    <script src="main.js" defer></script>
</body>

</html>
